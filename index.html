<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 导购智能体 · Demo</title>
  <style>
    :root {
      --bg: #faf6ef;
      --card: #fffdf8;
      --edge: #e7ddcc;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --ink: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--edge);
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.05em;
    }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    #chat {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--amber); color: #fff; border-bottom-right-radius: 4px; }
    .msg.agent { align-self: flex-start; background: var(--card); border: 1px solid var(--edge); border-bottom-left-radius: 4px; }
    .msg.step { align-self: flex-start; background: transparent; color: var(--muted); font-size: 13px; padding: 2px 4px; }
    .msg.step .tool { color: var(--amber-dark); font-family: ui-monospace, monospace; }
    #inputArea {
      border-top: 1px solid var(--edge);
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    #input {
      flex: 1;
      border: 1px solid var(--edge);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      resize: none;
      outline: none;
    }
    #input:focus { border-color: var(--amber); }
    #send {
      border: none;
      background: var(--amber);
      color: #fff;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send:hover { background: var(--amber-dark); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .dot { display:inline-block; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }
    /* 口令遮罩 */
    #gate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .gate-card {
      background: var(--card); border: 1px solid var(--edge);
      border-radius: 16px; padding: 32px; max-width: 360px; width: 90%;
      text-align: center;
    }
    .gate-card h2 { margin: 0 0 8px; font-size: 20px; }
    .gate-card p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
    #passInput {
      width: 100%; border: 1px solid var(--edge); border-radius: 10px;
      padding: 12px 14px; font-size: 15px; margin-bottom: 12px; outline: none;
    }
    #passInput:focus { border-color: var(--amber); }
    #unlockBtn {
      width: 100%; border: none; background: var(--amber); color: #fff;
      border-radius: 10px; padding: 12px; font-size: 15px; cursor: pointer;
    }
    #unlockBtn:hover { background: var(--amber-dark); }
    .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
    #chat.hidden, #inputArea.hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>AI 导购智能体</h1>
    <p>LangGraph 编排 · 工具调用 · 流式交互（Demo）</p>
  </header>

  <div id="chat"></div>

  <!-- 访问口令遮罩：校验通过才显示聊天区 -->
  <div id="gate">
    <div class="gate-card">
      <h2>🔒 需要口令</h2>
      <p>这是一个个人 Demo，请输入访问口令开始对话。</p>
      <input id="passInput" type="password" placeholder="访问口令" />
      <button id="unlockBtn">进入</button>
      <p id="gateErr" class="err"></p>
    </div>
  </div>

  <div id="inputArea" class="hidden">
    <textarea id="input" rows="1" placeholder="试试：我想买一副 500 元以内的耳机"></textarea>
    <button id="send">发送</button>
  </div>

  <script>
    const chat = document.getElementById('chat')
    const input = document.getElementById('input')
    const sendBtn = document.getElementById('send')

    chat.classList.add('hidden')

    // 口令验证
    const gate = document.getElementById('gate')
    const passInput = document.getElementById('passInput')
    const unlockBtn = document.getElementById('unlockBtn')
    const gateErr = document.getElementById('gateErr')

    async function unlock() {
      const pass = passInput.value.trim()
      if (!pass) return
      try {
        const res = await fetch('/api/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passwd: pass }),
        })
        const data = await res.json()
        if (data.ok) {
          gate.style.display = 'none'
          chat.classList.remove('hidden')
          document.getElementById('inputArea').classList.remove('hidden')
          input.focus()
        } else {
          gateErr.textContent = '口令错误'
        }
      } catch (e) {
        gateErr.textContent = '网络错误，请重试'
      }
    }

    unlockBtn.addEventListener('click', unlock)
    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock()
    })

    function addMessage(role, text) {
      const div = document.createElement('div')
      div.className = 'msg ' + role
      div.textContent = text
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
      return div
    }

    function addStep(text) {
      const div = document.createElement('div')
      div.className = 'msg step'
      div.innerHTML = text
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
      return div
    }

    async function send() {
      const text = input.value.trim()
      if (!text) return
      input.value = ''
      addMessage('user', text)
      sendBtn.disabled = true

      // 占位的气泡，用于流式填充回答
      let answerEl = null

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        })
        if (!res.ok || !res.body) throw new Error('HTTP ' + res.status)

        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''

        while (true) {
          const { done, value } = await reader.read()
          if (done) break
          buffer += decoder.decode(value, { stream: true })

          let idx
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const chunk = buffer.slice(0, idx)
            buffer = buffer.slice(idx + 2)
            if (!chunk.startsWith('data:')) continue
            const data = chunk.slice(5).trim()
            if (data === '[DONE]') continue

            let payload
            try { payload = JSON.parse(data) } catch { continue }

            if (payload.type === 'tool_call') {
              addStep('⚙️ 调用工具 <span class="tool">' + payload.name + '(' + JSON.stringify(payload.args) + ')</span>')
            } else if (payload.type === 'tool_result') {
              addStep('📦 工具返回：' + payload.content.slice(0, 80))
            } else if (payload.type === 'answer') {
              if (!answerEl) answerEl = addMessage('agent', '')
              answerEl.textContent += payload.content
              chat.scrollTop = chat.scrollHeight
            }
          }
        }
      } catch (e) {
        if (!answerEl) answerEl = addMessage('agent', '出错了：' + e.message)
        else answerEl.textContent += '\n[出错：' + e.message + ']'
      } finally {
        sendBtn.disabled = false
        input.focus()
      }
    }

    sendBtn.addEventListener('click', send)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        send()
      }
    })
  </script>
</body>
</html>
